<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Van Nav</title>
</head>
<body>
  <!-- 这个占位文件只用于保证仓库在未构建前端时也能通过 go:embed 编译。 -->
  <!-- 真正运行站点前，请先执行 scripts/build-public.ps1 或 scripts/start-dev.ps1。 -->
  <main style="max-width: 720px; margin: 48px auto; font-family: sans-serif; line-height: 1.6;">
    <h1>Van Nav 前端资源尚未构建</h1>
    <p>请先在项目根目录执行：</p>
    <pre>powershell -ExecutionPolicy Bypass -File .\scripts\build-public.ps1</pre>
    <p>随后再执行：</p>
    <pre>go run .</pre>
  </main>
</body>
</html>
